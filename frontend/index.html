<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e7d7b4" />
    <!--
      SEO meta (title, description, canonical, Open Graph, Twitter, hreflang,
      JSON-LD) is managed per-route by the <Seo> component (React 19 document
      metadata). Don't add static description/og tags here or they'd duplicate
      the ones React injects. Search/AI crawlers are served the Laravel
      server-rendered mirror instead. This title is just the pre-hydration
      fallback; React replaces it on mount.
    -->
    <title>Tibia Atlas — Mapa, bestiario y guía de Tibia en español</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Defaults to
      // the parchment "day" atlas so first-time visitors meet the identity.
      try {
        var t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
