name: Deploy to production

# Every push to main builds the frontend and ships backend + SPA to the OVH VPS,
# then runs composer/migrate/cache and restarts the worker + PHP-FPM.
on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual "Run workflow" from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false # never interrupt a deploy mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build with vite directly (esbuild). `npm run build` runs `tsc -b` first,
      # which currently fails on unused-var lint in WIP pages — vite build ships
      # a valid bundle regardless. Restore `npm run build` once those are clean.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx vite build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync backend
        run: |
          rsync -az --delete \
            --exclude='vendor/' --exclude='.env' --exclude='storage/' \
            --exclude='node_modules/' --exclude='.git/' --exclude='bootstrap/cache/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            backend/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/tibia/backend/"

      - name: Sync frontend
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            frontend/dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/tibia/frontend/dist/"

      - name: Post-deploy (composer, migrate, cache, restart)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
          set -e
          cd /var/www/tibia/backend
          # Clear compiled caches BEFORE composer: a stale config:cache makes
          # composer's post-autoload `package:discover` fail, which corrupts the
          # package manifest and drops package routes (API 404s).
          rm -f bootstrap/cache/*.php
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan event:cache
          sudo chown -R ubuntu:www-data /var/www/tibia/backend
          sudo find storage bootstrap/cache -type d -exec chmod 2775 {} \;
          sudo find storage bootstrap/cache -type f -exec chmod 0664 {} \;
          sudo systemctl restart tibia-worker php8.5-fpm
          echo "Deploy OK"
          REMOTE
